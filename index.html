<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>對帳工具 Reconciliation Tool</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --success-color: #10b981;
            --error-color: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 16px;
        }

        @media (min-width: 640px) {
            body {
                padding: 20px;
            }
            .container {
                padding: 24px;
            }
        }

        h1 {
            text-align: center;
            margin-bottom: 16px;
            color: #1e3a8a;
            font-size: 1.4rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 640px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .section {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            width: 100%;
        }

        .section h2 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #334155;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 4px;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sign-toggle-btn {
            background-color: #e2e8f0;
            color: #334155;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }

        .sign-toggle-btn:hover {
            background-color: #cbd5e1;
        }

        .formatted-input {
            width: 110px;
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            text-align: right;
            font-size: 0.95rem;
        }

        @media (max-width: 380px) {
            .formatted-input {
                width: 90px;
            }
        }

        .formatted-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .denom-list .input-group label {
            width: 60px;
        }

        .denom-list .subtotal {
            width: 80px;
            text-align: right;
            font-size: 0.85rem;
            color: #64748b;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .result-box {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            background: #edf2f7;
            transition: all 0.3s ease;
        }

        .result-box.match {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .result-box.mismatch {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .result-box h3 {
            font-size: 1.15rem;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .result-details {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.9rem;
        }

        .btn-reset {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background-color: #64748b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-reset:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💰 對帳計算機</h1>

    <div class="grid">
        <!-- 帳目數據輸入區 -->
        <div class="section">
            <h2>1. 帳目數據</h2>
            <div class="input-group">
                <label for="revenue">今日總收入：</label>
                <input type="text" inputmode="numeric" id="revenue" class="formatted-input" placeholder="0" oninput="formatAndCalculate(this)">
            </div>
            <div class="input-group">
                <label for="expenditure">今日總支出：</label>
                <input type="text" inputmode="numeric" id="expenditure" class="formatted-input" placeholder="0" oninput="formatAndCalculate(this)">
            </div>
            <div class="input-group">
                <label for="computercount">電腦計算的值：</label>
                <div class="input-wrapper">
                    <button type="button" class="sign-toggle-btn" id="signBtn" onclick="toggleSign()">+</button>
                    <input type="text" inputmode="numeric" id="computercount" class="formatted-input" placeholder="0" oninput="formatAndCalculate(this, true)">
                </div>
            </div>
        </div>

        <!-- 實體鈔票硬幣清點區 -->
        <div class="section denom-list">
            <h2>2. 抽屜面額清點 (輸入張數)</h2>
            <div class="input-group"><label>2000</label><input type="text" inputmode="numeric" class="denom formatted-input" data-val="2000" placeholder="0" oninput="formatAndCalculate(this)"><span class="subtotal">0 元</span></div>
            <div class="input-group"><label>1000</label><input type="text" inputmode="numeric" class="denom formatted-input" data-val="1000" placeholder="0" oninput="formatAndCalculate(this)"><span class="subtotal">0 元</span></div>
            <div class="input-group"><label>500</label><input type="text" inputmode="numeric" class="denom formatted-input" data-val="500" placeholder="0" oninput="formatAndCalculate(this)"><span class="subtotal">0 元</span></div>
            <div class="input-group"><label>200</label><input type="text" inputmode="numeric" class="denom formatted-input" data-val="200" placeholder="0" oninput="formatAndCalculate(this)"><span class="subtotal">0 元</span></div>
            <div class="input-group"><label>100</label><input type="text" inputmode="numeric" class="denom formatted-input" data-val="100" placeholder="0" oninput="formatAndCalculate(this)"><span class="subtotal">0 元</span></div>
            <div class="input-group"><label>50</label><input type="text" inputmode="numeric" class="denom formatted-input" data-val="50" placeholder="0" oninput="formatAndCalculate(this)"><span class="subtotal">0 元</span></div>
            <div class="input-group"><label>10</label><input type="text" inputmode="numeric" class="denom formatted-input" data-val="10" placeholder="0" oninput="formatAndCalculate(this)"><span class="subtotal">0 元</span></div>
            <div class="input-group"><label>5</label><input type="text" inputmode="numeric" class="denom formatted-input" data-val="5" placeholder="0" oninput="formatAndCalculate(this)"><span class="subtotal">0 元</span></div>
            <div class="input-group"><label>1</label><input type="text" inputmode="numeric" class="denom formatted-input" data-val="1" placeholder="0" oninput="formatAndCalculate(this)"><span class="subtotal">0 元</span></div>
        </div>
    </div>

    <!-- 結果顯示區 -->
    <div id="resultBox" class="result-box">
        <h3 id="statusText">請輸入數據開始對帳</h3>
        <div class="result-details">
            <div>應有金額：<span id="expectedTotal">0</span> 元</div>
            <div>抽屜總共：<span id="actualTotal">0</span> 元</div>
            <div>相差：<span id="diffTotal">0</span> 元</div>
        </div>
    </div>

    <button class="btn-reset" onclick="resetForm()">清空重新輸入</button>
</div>

<script>
    let isNegative = false;

    // 將帶有逗號的字串轉回純數字
    function parseRawNumber(valStr) {
        if (!valStr) return 0;
        const cleaned = valStr.toString().replace(/,/g, '');
        const num = parseFloat(cleaned);
        return isNaN(num) ? 0 : num;
    }

    // 將數字加上千分位逗號
    function formatNumberWithCommas(valStr) {
        if (!valStr) return '';
        // 保留負號（如果有的話）
        const isNeg = valStr.startsWith('-');
        const rawDigits = valStr.replace(/[^\d]/g, '');
        if (!rawDigits) return isNeg ? '-' : '';
        const formatted = parseInt(rawDigits, 10).toLocaleString('en-US');
        return isNeg ? '-' + formatted : formatted;
    }

    function formatAndCalculate(input, isComputerField = false) {
        if (isComputerField) {
            // 處理負號輸入邏輯
            if (input.value.includes('-')) {
                isNegative = true;
            }
        }

        // 自動加上千分位點
        input.value = formatNumberWithCommas(input.value);

        if (isComputerField) {
            const num = parseRawNumber(input.value);
            if (num < 0) isNegative = true;
            else if (num > 0) isNegative = false;
            
            const btn = document.getElementById('signBtn');
            btn.textContent = isNegative ? '-' : '+';
            btn.style.backgroundColor = isNegative ? '#fee2e2' : '#e2e8f0';
            btn.style.color = isNegative ? '#991b1b' : '#334155';
        }

        calculate();
    }

    function toggleSign() {
        isNegative = !isNegative;
        const btn = document.getElementById('signBtn');
        btn.textContent = isNegative ? '-' : '+';
        btn.style.backgroundColor = isNegative ? '#fee2e2' : '#e2e8f0';
        btn.style.color = isNegative ? '#991b1b' : '#334155';
        
        const computerInput = document.getElementById('computercount');
        let rawVal = Math.abs(parseRawNumber(computerInput.value));
        
        if (rawVal !== 0) {
            let finalVal = isNegative ? -rawVal : rawVal;
            computerInput.value = formatNumberWithCommas(finalVal.toString());
        }
        calculate();
    }

    function calculate() {
        // 1. 計算應有金額：result = revenue - expenditure + computercount
        const revenue = parseRawNumber(document.getElementById('revenue').value);
        const expenditure = parseRawNumber(document.getElementById('expenditure').value);
        let computercount = parseRawNumber(document.getElementById('computercount').value);
        
        if (isNegative && computercount > 0) {
            computercount = -computercount;
        }

        const result = revenue - expenditure + computercount;

        // 2. 計算抽屜實體面額總和
        let total = 0;
        const denomInputs = document.querySelectorAll('.denom');
        
        denomInputs.forEach(input => {
            const count = parseRawNumber(input.value);
            const value = parseInt(input.getAttribute('data-val'), 10);
            const subtotal = count * value;
            total += subtotal;
            
            // 更新單項小計
            input.nextElementSibling.textContent = `${subtotal.toLocaleString()} 元`;
        });

        // 3. 計算差額：total - result
        const diff = total - result;
        const absDifference = Math.abs(diff);

        // 4. 更新畫面顯示
        document.getElementById('expectedTotal').textContent = result.toLocaleString();
        document.getElementById('actualTotal').textContent = total.toLocaleString();
        document.getElementById('diffTotal').textContent = absDifference.toLocaleString();

        const resultBox = document.getElementById('resultBox');
        const statusText = document.getElementById('statusText');

        if (diff === 0) {
            resultBox.className = 'result-box match';
            statusText.textContent = '對帳無誤！';
        } else if (diff > 0) {
            resultBox.className = 'result-box mismatch';
            statusText.textContent = `帳目有誤！抽屜多了 ${absDifference.toLocaleString()} 元！再算一次！`;
        } else {
            resultBox.className = 'result-box mismatch';
            statusText.textContent = `帳目有誤！抽屜少了 ${absDifference.toLocaleString()} 元！再算一次！`;
        }
    }

    function resetForm() {
        const inputs = document.querySelectorAll('.formatted-input');
        inputs.forEach(input => input.value = '');
        isNegative = false;
        const btn = document.getElementById('signBtn');
        btn.textContent = '+';
        btn.style.backgroundColor = '#e2e8f0';
        btn.style.color = '#334155';
        calculate();
    }

    // 初始化計算
    calculate();
</script>

</body>
</html>
